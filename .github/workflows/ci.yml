# SPDX-License-Identifier: Apache-2.0
# Part of bitwise-bus -- inferring undocumented bus protocols from captures.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, RelWithDebInfo]
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        env:
          CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
        run: |
          cmake -S . -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
                -DBW_WERROR=ON

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # The generators of the synthetic protocols, against a second implementation
      # of each, in Python, on 336 combinations of seed, size and timing noise.
      - name: Generators agree with their independent implementation
        run: python3 tests/mirror/mirror.py --check build/bitwise

      # End to end, on frames generated outside the tool: the search has to
      # recover an algorithm it was never told about. No unit test covers
      # argument parsing or file reading.
      - name: Identify a real protocol from raw frames
        run: |
          set -euo pipefail
          mkdir -p /tmp/frames
          python3 - <<'PY'
          import os, random
          def crc16_modbus(data):
              crc = 0xFFFF
              for b in data:
                  crc ^= b
                  for _ in range(8):
                      crc = (crc >> 1) ^ 0xA001 if (crc & 1) else (crc >> 1)
              return crc
          random.seed(7)
          for i in range(6):
              body = bytes([0x11, 0x03]) + bytes(random.randrange(256) for _ in range(8))
              c = crc16_modbus(body)
              open("/tmp/frames/f%d.bin" % i, "wb").write(body + bytes([c & 0xFF, c >> 8]))
          PY
          ./build/bitwise crc-catalog
          ./build/bitwise crc-find /tmp/frames/*.bin | tee /tmp/out.txt
          grep -q "CRC-16/MODBUS" /tmp/out.txt
          grep -q "little-endian" /tmp/out.txt
          grep -q "comfortably more evidence" /tmp/out.txt

      # Noise must produce no answer. A tool that confidently names a
      # protocol that is not there is worse than one that finds nothing.
      - name: Refuse to find a protocol in random bytes
        run: |
          set -euo pipefail
          mkdir -p /tmp/noise
          for i in 0 1 2 3 4 5; do
            head -c 20 /dev/urandom > /tmp/noise/n$i.bin
          done
          if ./build/bitwise crc-find /tmp/noise/*.bin | grep -q "comfortably more evidence"; then
            echo "claimed a confident match on random bytes"
            exit 1
          fi
          if ./build/bitwise crc-find --hidden-byte /tmp/noise/*.bin | grep -q "comfortably more evidence"; then
            echo "claimed a confident match on random bytes, with a hidden byte"
            exit 1
          fi
          echo "no false positive on noise"

      # MAVLink's CRC covers one byte that is in no frame (CRC_EXTRA). Frames
      # made outside the tool: without being told, there is no answer; asked to
      # try a hidden byte, it finds the CRC and the byte.
      - name: Find a CRC with a byte that is in no frame
        run: |
          set -euo pipefail
          mkdir -p /tmp/hidden
          python3 - <<'PY'
          import random
          def mcrf4xx(data, extra):
              crc = 0xFFFF
              for b in list(data) + [extra]:
                  crc ^= b
                  for _ in range(8):
                      crc = (crc >> 1) ^ 0x8408 if (crc & 1) else (crc >> 1)
              return crc
          random.seed(11)
          for i in range(6):
              body = bytes([9, i, 1, 1, 0]) + bytes(random.randrange(256) for _ in range(9))
              c = mcrf4xx(body, 50)
              open("/tmp/hidden/m%d.bin" % i, "wb").write(bytes([0xFE]) + body + bytes([c & 0xFF, c >> 8]))
          PY
          if ./build/bitwise crc-find /tmp/hidden/*.bin; then
            echo "found a CRC that needs a byte it was not given"
            exit 1
          fi
          ./build/bitwise crc-find --hidden-byte /tmp/hidden/*.bin | tee /tmp/hidden.txt
          grep -q "CRC-16/MCRF4XX" /tmp/hidden.txt
          grep -q "0x32" /tmp/hidden.txt
          grep -q "comfortably more evidence" /tmp/hidden.txt

  sanitizers:
    name: asan + ubsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: |
          cmake -S . -B build-san -G Ninja \
                -DCMAKE_BUILD_TYPE=Debug \
                -DBW_WERROR=ON \
                -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"

      - name: Build
        run: cmake --build build-san -j

      - name: Test
        env:
          UBSAN_OPTIONS: print_stacktrace=1
          ASAN_OPTIONS: detect_leaks=1
        run: ./build-san/bw_tests

  # The definitions the exporter writes, compiled by the real Kaitai compiler and
  # read back with the parser it makes: tests/roundtrip/kaitai_roundtrip.py. The
  # compiler and the runtime are pinned, so that a new release cannot turn this red.
  kaitai-roundtrip:
    name: Kaitai round trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the CLI
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBW_BUILD_TESTS=OFF
          cmake --build build -j

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the Kaitai compiler and runtime
        run: |
          npm install --prefix kaitai --no-audit --no-fund kaitai-struct-compiler@0.11.0
          python3 -m pip install kaitaistruct==0.11 PyYAML==6.0.3

      - name: Round trip
        run: |
          python3 tests/roundtrip/kaitai_roundtrip.py \
              --bitwise build/bitwise --compiler kaitai/node_modules/kaitai-struct-compiler
